<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Compare — Schools Finder</title>
<meta name="description" content="Put up to five New York City public schools side by side, one published measure per row, each with its school year.">
<meta property="og:title" content="Compare — Schools Finder">
<meta property="og:description" content="Put up to five New York City public schools side by side, one published measure per row, each with its school year.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="css/site.css">
<script src="js/site.js" defer></script>
<script src="js/search.js" defer></script>
<script src="js/compare.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header data-chrome="masthead"></header>

<main id="main" class="is-loading">
<noscript>
  <div class="wrap"><div class="note-box"><p>
    <strong>This page needs JavaScript.</strong> It draws each figure from the
    published data in the browser. The <a href="data.html">Data page</a> has
    every source and the full download.
  </p></div></div>
</noscript>

  <section class="wrap console">
    <h1 class="console-h1">Compare schools</h1>
    <p class="console-sub">Compare up to five schools by measure.</p>

    <!-- Every control sits in one bar directly above the table it acts on. -->
    <div class="compare-bar">
      <div class="search-shell" id="compare-search"></div>
      <button class="tool-button" type="button" id="measures-open"
              aria-haspopup="dialog" aria-controls="measures-panel">
        Choose measures <span class="tool-badge" id="measures-count" aria-hidden="true"></span>
      </button>
      <div class="bar-actions">
        <button class="text-button" type="button" id="clear-schools" disabled>Clear schools</button>
        <button class="text-button" type="button" id="download-csv" disabled>Download CSV</button>
        <button class="text-button" type="button" id="copy-link" disabled>Copy link</button>
      </div>
    </div>
    <p class="sr-only" id="compare-status" role="status"></p>
  </section>

  <section class="wrap">
    <div id="comparison"></div>
    <p class="statusline mono" data-status></p>
  </section>
</main>

<dialog class="measures-panel" id="measures-panel" aria-labelledby="measures-title">
  <div class="panel-head">
    <h2 id="measures-title">Measures</h2>
    <button class="panel-close" type="button" id="measures-close" aria-label="Close">×</button>
  </div>
  <div class="panel-filter">
    <label class="sr-only" for="measure-filter">Filter measures</label>
    <input type="search" id="measure-filter" placeholder="Filter measures" autocomplete="off" spellcheck="false">
  </div>
  <div class="panel-body" id="measure-list"></div>
  <div class="panel-foot">
    <button class="text-button" type="button" id="measures-reset">Reset to defaults</button>
    <button class="panel-done" type="button" id="measures-done">Done</button>
  </div>
</dialog>

<footer data-chrome="footer"></footer>
</body>
</html>
