<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>School — Schools Finder</title>
<meta name="description" content="Every published statistic for one New York City public school, with the definition, reporting period and source for each value.">
<meta property="og:title" content="School — Schools Finder">
<meta property="og:description" content="Every published statistic for one New York City public school, with the definition, reporting period and source for each value.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="css/site.css">
<script src="js/site.js" defer></script>
<script src="js/search.js" defer></script>
<script src="js/map.js" defer></script>
<script src="js/school.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header data-chrome="masthead"></header>

<main id="main" class="is-loading">
<noscript>
  <div class="wrap"><div class="note-box"><p>
    <strong>This page needs JavaScript.</strong> It draws each figure from the
    published data in the browser. The <a href="data.html">Data page</a> has
    every source and the full download.
  </p></div></div>
</noscript>

  <section class="wrap profile-top">
    <p class="crumb"><a id="back-link" href="browse.html">← All schools</a></p>
    <div class="entity-head" id="school-head">
      <p class="kind">Loading</p>
      <h1>School profile</h1>
    </div>
    <div class="table-tools" id="compare-action"></div>
  </section>

  <section class="wrap profile-intro" aria-label="About this school">
    <div class="intro-grid">
      <div class="intro-facts">
        <dl class="fact-list" id="school-facts"></dl>
        <p class="source-line" id="facts-source" hidden></p>
      </div>
      <div class="locator" id="school-locator" hidden></div>
    </div>
    <section class="own-words-wrap" id="school-overview" aria-labelledby="own-words-title" hidden></section>
  </section>

  <section class="profile-data" id="school-metrics" aria-labelledby="data-title"></section>

  <section class="wrap profile-foot">
    <p class="statusline mono" data-status></p>
  </section>

  <section class="wrap">
    <h2 class="section-label">Look up another school</h2>
    <div class="search-shell" id="profile-search">
      <!-- A real input, so the box works before the search index has loaded.
           Touching it mounts the full search and hands focus over. -->
      <div class="search-row">
        <label class="sr-only" for="profile-search-stub">Search for a school by name or DBN</label>
        <input id="profile-search-stub" type="search" autocomplete="off"
               placeholder="Search by name or DBN…">
      </div>
    </div>
  </section>
</main>

<footer data-chrome="footer"></footer>
</body>
</html>
