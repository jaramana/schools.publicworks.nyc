name: Refresh data

# Daily, plus a button in the Actions tab. GitHub disables a scheduled workflow
# after sixty days without repository activity, so the manual trigger is not a
# convenience: it is the recovery path when the schedule has been switched off.
on:
  schedule:
    - cron: "20 9 * * *"      # 09:20 UTC, after the New York overnight
  workflow_dispatch:

# Only one refresh at a time. Two runs publishing at once would race on the
# same generated files.
concurrency:
  group: refresh
  cancel-in-progress: false

# Issues are opened when Open Data lists a newer school zone year.
permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The geocoder answers per address and the results never change for an
      # address that has not moved, so the cache is worth carrying between runs.
      # It is keyed by month so it is rebuilt occasionally rather than forever.
      - name: Restore the geocode cache
        uses: actions/cache@v4
        with:
          path: data-raw/geocode.json
          key: geocode-${{ github.run_id }}
          restore-keys: geocode-

      - name: Build
        run: python run.py

      # The validation report is kept whether the build passed or failed. When a
      # source changes shape, this file says which check caught it.
      - name: Keep the validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation
          path: |
            build/validation.json
            build/fetch-manifest.json
            build/zones-diff.json
          retention-days: 30

      # A newer zone year is built only after it is reviewed and added to
      # ZONE_YEARS, so the workflow says so once, in an issue, and leaves it
      # open until then.
      - name: Open an issue for a newer zone year
        if: always()
        # A failure here must not stop the publish step below.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          next=$(python -c "import json; print((json.load(open('build/fetch-manifest.json')).get('zones') or {}).get('next') or '')" 2>/dev/null || true)
          if [ -z "$next" ]; then
            echo "No unreviewed zone year is listed."
            exit 0
          fi
          title="School Zones $next is on NYC Open Data"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "An issue is already open for $next."
            exit 0
          fi
          gh issue create --title "$title" --body "NYC Open Data lists School Zones $next. The site keeps building the newest reviewed year until $next is checked and added to ZONE_YEARS in pipeline/00_config.py. The catalog search: https://data.cityofnewyork.us/browse?q=School%20Zones"

      - name: Publish if the public files changed
        run: |
          git config user.name "schools.publicworks.nyc bot"
          git config user.email "actions@github.com"
          git add docs/data docs/downloads

          # Retrieval dates, the build date and the download timestamps change on
          # every run even when no figure did. Committing on those alone would add
          # a commit a day to a dataset that moves once a year, so tools/changed.py
          # sets them aside and lists only the files with a real change.
          changed=$(python tools/changed.py)
          if [ -z "$changed" ]; then
            echo "No change to the published data. Nothing to commit."
            git reset
            exit 0
          fi

          echo "Changed files:"
          echo "$changed" | head -20
          git add docs/data/status.json

          # The message is written to a file rather than built inline, so the
          # shell never has to nest a heredoc inside a quoted argument.
          python tools/commit_message.py > /tmp/commit-message.txt
          cat /tmp/commit-message.txt
          git commit -F /tmp/commit-message.txt
          git push
